name: Validate Herman Miller Sayl Fixed Models

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/geometry/herman-miller-sayl-fixed-models.json'
      - 'scripts/validate-herman-miller-sayl-fixed-models.mjs'
      - '.github/workflows/herman-miller-sayl-fixed-models.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-herman-miller-sayl-fixed-models
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and validate manufacturer models transiently
        run: node scripts/validate-herman-miller-sayl-fixed-models.mjs
      - name: Commit metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/metrics/herman-miller-sayl-fixed-models-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: validate Herman Miller Sayl fixed models"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
