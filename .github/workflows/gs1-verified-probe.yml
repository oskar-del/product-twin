name: Probe Verified by GS1 Identity

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/identity/gs1-verification-targets.json'
      - 'scripts/probe-gs1-verified.mjs'
      - '.github/workflows/gs1-verified-probe.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-gs1-verified-probe
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run one deliberate GS1 GTIN verification
        run: node scripts/probe-gs1-verified.mjs
      - name: Commit minimal identity evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/identity/gs1-verified-latest.json data/metrics/gs1-verified-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: record Verified by GS1 identity probe"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
