name: Project Requirements

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/project-requirements.yml"
      - "scripts/concrete-requirement.mjs"
      - "scripts/pool-requirement.mjs"
      - "scripts/solar-requirement.mjs"
      - "data/projects/**"
      - "data/energy/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-twin-project-requirements
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive structural concrete requirement
        run: npm run concrete:requirement
      - name: Derive pool circulation requirement
        run: npm run pool:requirement
      - name: Derive solar requirement
        run: npm run solar:requirement
      - name: Commit requirements
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/requirements data/energy/*solar-requirement.json
          if git diff --cached --quiet; then
            echo "No requirement changes."
            exit 0
          fi
          git commit -m "data: refresh project performance and procurement requirements"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
