name: Shopify Product Twin Ingest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shopify-ingest.yml"
      - "config/**"
      - "scripts/**"
      - "package.json"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2,5"

permissions:
  contents: write

concurrency:
  group: shopify-product-twin-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull Shopify Global Catalog
        run: npm run ingest:shopify

      - name: Triage Twin Candidates
        run: npm run triage:shopify

      - name: Build canonical category coverage
        run: npm run coverage

      - name: Show summary
        run: npm run summarize

      - name: Commit refreshed catalogue
        run: |
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/shopify data/coverage
          if git diff --cached --quiet; then
            echo "No catalogue changes."
            exit 0
          fi
          git commit -m "data: refresh Shopify candidates and category coverage"
          git push
