name: Capture Herman Miller Sayl Public GLB

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture-herman-miller-sayl-glb.mjs'
      - 'config/geometry/herman-miller-sayl-target.json'
      - '.github/workflows/herman-miller-sayl-public-glb-capture.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-herman-miller-sayl-public-glb
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Use public configurator Downloads flow
        run: node scripts/capture-herman-miller-sayl-glb.mjs
      - name: Commit metadata only
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .runtime || echo "Runtime assets intentionally not committed"
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/metrics/herman-miller-sayl-public-glb-capture-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: record Herman Miller Sayl public GLB capture"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
