name: Build Arper Ralik 7417 Avatar Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/geometry/arper-ralik-7417-target.json'
      - 'scripts/capture-arper-ralik-7417-3ds.mjs'
      - 'scripts/qa-arper-ralik-7417-glb.py'
      - '.github/workflows/arper-ralik-7417-avatar.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-arper-ralik-7417
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture and conversion tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y assimp-utils
          pip install trimesh numpy
      - name: Capture exact manufacturer 3DS
        run: node scripts/capture-arper-ralik-7417-3ds.mjs
      - name: Convert 3DS to ephemeral GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/arper-ralik-7417
          if [ -f .runtime/arper-ralik-7417/source.3ds ]; then
            assimp export .runtime/arper-ralik-7417/source.3ds .runtime/arper-ralik-7417/model.glb -f glb2
          else
            echo "No 3DS captured; QA will record the missing asset."
          fi
      - name: Validate physical bounds
        run: python scripts/qa-arper-ralik-7417-glb.py
      - name: Commit metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/metrics/arper-ralik-7417-3ds-capture-latest.json data/metrics/arper-ralik-7417-glb-qa-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: record Arper Ralik exact-avatar QA"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
