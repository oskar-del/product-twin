name: Technical Evidence Fit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/technical-evidence.yml"
      - "data/evidence/manufacturer/**"
      - "scripts/evaluate-technical-fit.mjs"
      - "data/projects/**"
      - "data/energy/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-twin-technical-evidence
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Evaluate Huawei inverter against Marbella project
        run: npm run technical:fit
      - name: Commit fit result
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/tests/results
          if git diff --cached --quiet; then
            echo "No fit changes."
            exit 0
          fi
          git commit -m "data: refresh authoritative technical fit result"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
