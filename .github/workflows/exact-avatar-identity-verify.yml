name: Verify Exact Avatar Commerce Identity

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify-exact-avatar-commerce.mjs'
      - 'data/identity/exact-avatar-commerce-candidates.json'
      - 'config/geometry/exact-avatar-targets.json'
      - '.github/workflows/exact-avatar-identity-verify.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-exact-avatar-identity
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-exact-avatar-commerce.mjs
      - name: Commit identity evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/identity/exact-avatar-commerce-verification.json data/metrics/exact-avatar-commerce-verification-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: verify exact avatar commerce identity"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
