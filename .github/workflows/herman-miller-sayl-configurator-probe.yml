name: Probe Herman Miller Sayl Configurator

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/geometry/herman-miller-sayl-target.json'
      - 'scripts/probe-herman-miller-sayl-configurator.mjs'
      - '.github/workflows/herman-miller-sayl-configurator-probe.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-herman-miller-sayl-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public configurator flow
        run: node scripts/probe-herman-miller-sayl-configurator.mjs
      - name: Commit reference-only probe results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/geometry/herman-miller-sayl-configurator-probe.json data/metrics/herman-miller-sayl-configurator-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Herman Miller Sayl configurator probe"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
