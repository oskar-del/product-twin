name: Build LONGi LR7-72HVH-670M G2 PV Proxy

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/geometry/longi-lr7-72hvh-670m-target.json'
      - 'scripts/build-longi-lr7-72hvh-670m-proxy.py'
      - '.github/workflows/longi-lr7-72hvh-670m-g2-proxy.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-longi-670m-g2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry tools
        run: pip install trimesh==4.7.4
      - name: Build and QA exact-identity PV proxy
        run: python scripts/build-longi-lr7-72hvh-670m-proxy.py
      - name: Commit Product Twin-owned proxy + QA metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/geometry/avatars/longi-lr7-72hvh-670m-g2-pv-proxy.glb data/metrics/longi-lr7-72hvh-670m-g2-proxy-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "geometry: build LONGi 670M G2 PV proxy"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
