name: Reconcile Canonical Energy Taxonomy

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/taxonomy-energy-extension.json'
      - 'scripts/reconcile-energy-taxonomy.mjs'
      - '.github/workflows/reconcile-energy-taxonomy.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-energy-taxonomy
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile extension into canonical taxonomy
        run: node scripts/reconcile-energy-taxonomy.mjs
      - name: Commit canonical taxonomy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add config/taxonomy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "taxonomy: integrate component-level energy categories"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
