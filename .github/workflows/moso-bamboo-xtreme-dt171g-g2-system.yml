name: Build MOSO Bamboo X-treme G2 Decking System

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/geometry/moso-bamboo-xtreme-dt171g-target.json'
      - 'scripts/build-moso-bamboo-xtreme-dt171g-system.py'
      - '.github/workflows/moso-bamboo-xtreme-dt171g-g2-system.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-moso-dt171g-g2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry tools
        run: pip install trimesh==4.7.4
      - name: Build repeat system and quantity takeoff QA
        run: python scripts/build-moso-bamboo-xtreme-dt171g-system.py
      - name: Commit Product Twin-owned system proxy + QA metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/geometry/avatars/moso-bamboo-xtreme-bo-dtht171g-g2-system-proxy.glb data/metrics/moso-bamboo-xtreme-dt171g-g2-system-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "materials: build MOSO Bamboo X-treme G2 repeat system"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
