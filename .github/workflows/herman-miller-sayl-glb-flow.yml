name: Resolve Herman Miller Sayl GLB Flow

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/resolve-herman-miller-glb-flow.mjs'
      - 'config/geometry/herman-miller-sayl-target.json'
      - '.github/workflows/herman-miller-sayl-glb-flow.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-herman-miller-sayl-glb-flow
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve public GLB export flow
        run: node scripts/resolve-herman-miller-glb-flow.mjs
      - name: Commit reference-only resolver output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/geometry/herman-miller-sayl-glb-flow.json data/metrics/herman-miller-sayl-glb-flow-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: resolve Herman Miller Sayl GLB flow"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
