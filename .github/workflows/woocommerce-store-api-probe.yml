name: Probe WooCommerce Store API

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/commerce/woocommerce-probe-stores.json'
      - 'config/source-mappings/woocommerce-store.json'
      - 'scripts/probe-woocommerce-store-api.mjs'
      - '.github/workflows/woocommerce-store-api-probe.yml'

permissions:
  contents: write

concurrency:
  group: product-twin-woocommerce-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public merchant Store APIs
        run: node scripts/probe-woocommerce-store-api.mjs
      - name: Commit reference-only results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/commerce/woocommerce-store-api-latest.json data/metrics/woocommerce-store-api-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: record WooCommerce Store API probe"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*3))
          done
          exit 1
