name: Refresh Selected Product References

on:
  push:
    branches: [main]
    paths:
      - "data/references/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-twin-selected-reference-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh selected variants live with Global lookup
        run: npm run references:refresh
      - name: Retest merchant Cart MCP
        run: npm run carts:create
      - name: Prepare guarded Checkout quote
        run: npm run checkouts:quote
      - name: Commit aggregate refresh metrics only
        run: |
          set -euo pipefail
          git config user.name "product-twin-bot"
          git config user.email "product-twin-bot@users.noreply.github.com"
          git add data/metrics
          if git diff --cached --quiet; then
            echo "No aggregate changes."
            exit 0
          fi
          git commit -m "data: refresh selected Product Twin commerce references"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
