<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEEEC;--panel:#F5F6F3;--ink:#0E2129;--muted:#5C6B6E;--line:#D3D8D3;--sea:#1F6E7D;--sea-deep:#123f49;--sand:#B99256;--shadow:0 24px 60px -32px rgba(14,33,41,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0C1A20;--panel:#122730;--ink:#EAEFEC;--muted:#9DB0B2;--line:#20393f;--sea:#4FB0C0;--sea-deep:#8fd3dd;--sand:#D8B57E;--shadow:0 24px 60px -30px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0C1A20;--panel:#122730;--ink:#EAEFEC;--muted:#9DB0B2;--line:#20393f;--sea:#4FB0C0;--sea-deep:#8fd3dd;--sand:#D8B57E;--shadow:0 24px 60px -30px rgba(0,0,0,.6)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--sea);margin:0 0 .5em}
h1,h2{font-family:"Fraunces",Georgia,serif;font-weight:400;line-height:1.02;letter-spacing:-.01em;text-wrap:balance;margin:0}
.lede{color:var(--muted);max-width:46ch}.fig{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
img{max-width:100%;display:block}
.hero{position:relative;min-height:96vh;display:flex;align-items:flex-end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,22,28,.28) 0%,rgba(9,22,28,0) 34%,rgba(9,22,28,.62) 100%)}
.hero-inner{position:relative;z-index:2;padding:clamp(24px,6vw,84px);color:#F4F6F4;max-width:1200px;margin:0 auto;width:100%}
.hero .eyebrow{color:#CFEAEA}.hero h1{font-size:clamp(56px,13vw,168px);font-weight:300;color:#fff}
.hero .sub{max-width:40ch;color:#DCE6E5;font-size:clamp(16px,2vw,21px);margin:.6em 0 0}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
.thesis{padding:clamp(70px,11vw,150px) 0 clamp(30px,6vw,70px)}
.thesis h2{font-size:clamp(30px,5vw,58px);max-width:16ch;font-weight:400}
.thesis .lede{font-size:clamp(17px,2vw,21px);margin-top:1.4em;max-width:56ch}
.thesis .meta{display:flex;flex-wrap:wrap;gap:2.4em;margin-top:2.6em;padding-top:1.6em;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.thesis .meta b{color:var(--ink);font-weight:500}
.villa{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,72px);align-items:start;padding:clamp(56px,9vw,120px) clamp(20px,5vw,56px);max-width:1320px;margin:0 auto;border-top:1px solid var(--line)}
.villa.rev{grid-template-columns:.9fr 1.1fr}.villa.rev .villa-shot{order:2}
.villa-shot{position:sticky;top:36px;align-self:start}
.villa-shot img{width:100%;border-radius:4px;box-shadow:var(--shadow);aspect-ratio:16/10;object-fit:cover}
.villa-body h2{font-size:clamp(38px,6vw,74px);margin:.05em 0 .35em;font-weight:300}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:1.8em 0}
.ledger>div{background:var(--panel);padding:16px 18px}.ledger>div:last-child{grid-column:1/-1}
.ledger dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:.5em}
.ledger dd{margin:0;font-size:24px}.ledger dd .fig{font-size:30px;font-weight:500}
.ledger dd .lv{font-size:16px;color:var(--ink);font-family:"IBM Plex Mono",monospace;letter-spacing:.02em}
.plan{margin:0}.plan img{width:100%;max-height:340px;object-fit:contain;border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:6px}
.plan figcaption{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:.8em}
.film{max-width:1320px;margin:0 auto;padding:clamp(40px,7vw,90px) clamp(20px,5vw,56px)}
.film-head{max-width:56ch;margin-bottom:2.2em}.film-head h2{font-size:clamp(30px,5vw,56px);font-weight:400;margin:.1em 0 .5em}
.film video{width:100%;border-radius:3px;box-shadow:var(--shadow);background:#0b171c}
footer{background:var(--sea-deep);color:#E6F1F0;margin-top:clamp(40px,7vw,90px)}
footer .wrap{padding:clamp(50px,8vw,100px) clamp(20px,5vw,56px)}
footer h2{color:#fff;font-size:clamp(26px,4vw,44px);font-weight:300;max-width:20ch}
.credits{display:flex;flex-wrap:wrap;gap:2.6em 4em;margin-top:3em;padding-top:2em;border-top:1px solid rgba(255,255,255,.16);font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}
.credits div span{display:block;color:#9FC4C4;text-transform:uppercase;letter-spacing:.2em;font-size:10.5px;margin-bottom:.6em}
.credits div b{font-weight:500;color:#fff;font-family:"Instrument Sans",sans-serif;font-size:15px;letter-spacing:0}
.twin-note{margin-top:2.6em;color:#B7D4D3;max-width:60ch;font-size:14px;line-height:1.7}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease}.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
@media (max-width:820px){.villa,.villa.rev{grid-template-columns:1fr;gap:24px}.villa-shot{position:static}.villa.rev .villa-shot{order:0}body{font-size:16px}}
</style></head><body>
  <header class="hero"><img src="{{HERO}}" alt="{{NAME}}">
    <div class="hero-inner"><p class="eyebrow">{{EYEBROW}}</p><h1>{{NAME}}</h1><p class="sub">{{SUB}}</p></div>
  </header>
  <div class="wrap thesis reveal"><p class="eyebrow">{{THESIS_EYEBROW}}</p><h2>{{THESIS_H}}</h2>
    <p class="lede">{{THESIS_LEDE}}</p><div class="meta">{{META}}</div></div>
  {{VILLAS}}
  {{FILM}}
  <footer><div class="wrap reveal"><h2>{{FOOT_H}}</h2><div class="credits">{{CREDITS}}</div>
    <p class="twin-note">{{TWIN_NOTE}}</p></div></footer>
<script>
const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script></body></html>
