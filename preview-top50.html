<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newport G2 Avatars — Top 50</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0e0f11; color: #e8e4de; font-family: -apple-system, system-ui, sans-serif; }
.header { padding: 2.5rem 2rem 1.5rem; max-width: 1400px; margin: 0 auto; border-bottom: 1px solid #222; }
.header h1 { font-size: 2rem; font-weight: 300; letter-spacing: -0.02em; }
.header p { color: #888; font-size: 0.85rem; margin-top: 0.4rem; }
.grid { max-width: 1400px; margin: 0 auto; padding: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
.card { background: #181a1e; border: 1px solid #2a2d35; border-radius: 6px; overflow: hidden; }
.card img { width: 100%; height: 280px; object-fit: contain; display: block; background: #1e2028; }
.card-body { padding: 1rem 1.2rem 1.2rem; }
.card-brand { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #b8965a; }
.card-name { font-size: 1rem; margin-top: 0.3rem; font-weight: 400; }
.card-meta { font-size: 0.75rem; color: #666; margin-top: 0.4rem; }
.card-footer { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1.2rem; border-top: 1px solid #2a2d35; }
.card-price { font-variant-numeric: tabular-nums; font-weight: 500; }
.card-cta { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #b8965a; text-decoration: none; border: 1px solid #b8965a; padding: 0.4rem 0.8rem; border-radius: 2px; }
.card-cta:hover { background: #b8965a; color: #0e0f11; }
.placeholder { width: 100%; height: 280px; display: flex; align-items: center; justify-content: center; background: #1e2028; color: #444; font-size: 0.8rem; }
</style>
</head>
<body>
<header class="header">
<h1>Newport G2 Avatars — Top 50</h1>
<p>3D proxy geometry from the Avatar Factory · 78,895 – 215,495 SEK · each GLB is a dimension-verified G2 proxy</p>
</header>
<div class="grid" id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const items = ITEMS_PLACEHOLDER;
const fmt = new Intl.NumberFormat('sv-SE');
const grid = document.getElementById('grid');

grid.innerHTML = items.map((item, i) => `
<article class="card" id="card-${i}">
  <div class="placeholder" id="ph-${i}">Rendering…</div>
  <div class="card-body">
    <div class="card-brand">${item.brand}</div>
    <div class="card-name">${item.name}</div>
    <div class="card-meta">${item.category} · ${item.material}</div>
  </div>
  <div class="card-footer">
    <span class="card-price">${fmt.format(item.price)} kr</span>
    <a class="card-cta" href="${item.affiliate_link}" target="_blank" rel="noopener">Shop →</a>
  </div>
</article>`).join('');

// Single shared renderer for snapshotting
const W = 600, H = 560;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.setClearColor(0x1e2028);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 100);

const ambient = new THREE.AmbientLight(0xfff5e6, 0.6);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(3, 5, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xd4e0ff, 0.6);
fill.position.set(-3, 2, -2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe8d0, 0.4);
rim.position.set(0, 3, -5);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x1a1c22, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const loader = new GLTFLoader();

async function renderThumbnail(index, item) {
  return new Promise((resolve) => {
    loader.load(`/glb/newport-${item.id}-g2-proxy.glb`, (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      model.position.y += size.y / 2;
      scene.add(model);

      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 2.2;
      camera.position.set(dist * 0.7, dist * 0.5, dist * 0.7);
      camera.lookAt(0, size.y * 0.4, 0);

      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');

      scene.remove(model);
      model.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
          else child.material.dispose();
        }
      });

      const ph = document.getElementById(`ph-${index}`);
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = item.name;
      ph.replaceWith(img);
      resolve();
    }, undefined, () => {
      const ph = document.getElementById(`ph-${index}`);
      if (ph) ph.textContent = 'Failed';
      resolve();
    });
  });
}

// Render sequentially to avoid memory pressure
for (let i = 0; i < items.length; i++) {
  await renderThumbnail(i, items[i]);
}

renderer.dispose();
</script>
</body>
</html>
