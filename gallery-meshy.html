<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meshy Gallery — Living Room Collection</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0e0f11; color: #e8e4de; font-family: -apple-system, system-ui, sans-serif; }
.header { padding: 2rem 2rem 1rem; max-width: 1400px; margin: 0 auto; border-bottom: 1px solid #222; }
.header h1 { font-size: 1.8rem; font-weight: 300; }
.header p { color: #888; font-size: 0.85rem; margin-top: 0.4rem; }
.grid { max-width: 1400px; margin: 0 auto; padding: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1.5rem; }
.card { background: #181a1e; border: 1px solid #2a2d35; border-radius: 6px; overflow: hidden; }
.card .render-area { width: 100%; height: 320px; background: #1e2028; display: flex; align-items: center; justify-content: center; color: #444; font-size: 0.8rem; }
.card canvas { display: block; }
.card-body { padding: 1rem 1.2rem; }
.card-type { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: #b8965a; }
.card-name { font-size: 0.95rem; margin-top: 0.25rem; }
.card-meta { font-size: 0.72rem; color: #666; margin-top: 0.3rem; }
.card-price { font-size: 0.85rem; margin-top: 0.4rem; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="header">
<h1>Meshy Image-to-3D — Living Room Collection</h1>
<p>11 real 3D models generated from Newport product photos via Meshy.ai · 330 credits · all interactive (drag to rotate)</p>
</header>
<div class="grid" id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const items = ITEMS_PLACEHOLDER;
const fmt = new Intl.NumberFormat('sv-SE');
const grid = document.getElementById('grid');

grid.innerHTML = items.map((item, i) => `
<article class="card">
  <div class="render-area" id="ra-${i}">Loading ${item.name}…</div>
  <div class="card-body">
    <div class="card-type">${item.cat.replace('FFE.','').replace(/\./g,' › ')}</div>
    <div class="card-name">${item.name}</div>
    <div class="card-meta">${item.brand} · Meshy 7 Flagship</div>
    <div class="card-price">${fmt.format(item.price)} kr</div>
  </div>
</article>`).join('');

const loader = new GLTFLoader();

function createViewer(index, item) {
  const container = document.getElementById(`ra-${index}`);
  const W = container.clientWidth;
  const H = 320;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x1e2028);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;
  container.innerHTML = '';
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, W / H, 0.001, 200);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xfff5e6, 0.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.8);
  key.position.set(3, 5, 4); scene.add(key);
  const fill = new THREE.DirectionalLight(0xd4e0ff, 0.6);
  fill.position.set(-3, 2, -2); scene.add(fill);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),
    new THREE.MeshStandardMaterial({ color: 0x1a1c22, roughness: 0.95 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  loader.load(`/glb/${item.glb}`, (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    model.position.y += size.y / 2;
    scene.add(model);

    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim * 2.2;
    camera.position.set(dist * 0.7, dist * 0.5, dist * 0.7);
    controls.target.set(0, size.y * 0.4, 0);
    controls.update();
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

// Stagger loading to avoid overwhelming the browser
for (let i = 0; i < items.length; i++) {
  setTimeout(() => createViewer(i, items[i]), i * 500);
}
</script>
</body>
</html>
