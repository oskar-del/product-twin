<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>G2 Proxy vs Meshy — Moderno Soffa</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0e0f11; color: #e8e4de; font-family: -apple-system, system-ui, sans-serif; }
h1 { text-align: center; padding: 2rem 1rem 0.5rem; font-weight: 300; font-size: 1.8rem; }
.sub { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 1400px; margin: 0 auto; padding: 0 2rem 2rem; }
.panel { background: #181a1e; border: 1px solid #2a2d35; border-radius: 6px; overflow: hidden; }
.panel h2 { padding: 1rem 1.2rem 0.5rem; font-size: 1rem; font-weight: 400; }
.panel .meta { padding: 0 1.2rem 1rem; font-size: 0.75rem; color: #666; }
.panel canvas, .panel img { width: 100%; height: 500px; display: block; object-fit: contain; background: #1e2028; }
.verdict { text-align: center; padding: 1rem; font-size: 0.8rem; color: #b8965a; }
</style>
</head>
<body>
<h1>G2 Proxy vs Meshy Image-to-3D</h1>
<p class="sub">Moderno Soffa Aveiro Sand · Eichholtz · 215,495 SEK</p>
<div class="compare">
  <div class="panel">
    <h2>Old G2 Proxy (superellipsoid)</h2>
    <div class="meta">18 KB · parametric primitive</div>
    <div id="old">Rendering…</div>
  </div>
  <div class="panel">
    <h2>Meshy Image-to-3D</h2>
    <div class="meta">76 MB · 1.97M faces · textured</div>
    <div id="new">Rendering…</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function createViewer(containerId, glbUrl) {
  const container = document.getElementById(containerId);
  const W = container.clientWidth || 600;
  const H = 500;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x1e2028);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;
  container.innerHTML = '';
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, W / H, 0.001, 200);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xfff5e6, 0.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.8);
  key.position.set(3, 5, 4);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xd4e0ff, 0.6);
  fill.position.set(-3, 2, -2);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffe8d0, 0.4);
  rim.position.set(0, 3, -5);
  scene.add(rim);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 10),
    new THREE.MeshStandardMaterial({ color: 0x1a1c22, roughness: 0.95 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  new GLTFLoader().load(glbUrl, (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    model.position.y += size.y / 2;
    scene.add(model);

    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim * 2.2;
    camera.position.set(dist * 0.7, dist * 0.5, dist * 0.7);
    controls.target.set(0, size.y * 0.4, 0);
    controls.update();
  }, undefined, (err) => {
    container.textContent = 'Failed to load: ' + err.message;
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

createViewer('old', '/glb/newport-60667-g2-proxy.glb');
createViewer('new', '/glb/moderno-soffa-meshy.glb');
</script>
</body>
</html>
