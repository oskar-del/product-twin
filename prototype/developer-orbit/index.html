<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Twin · Developer Orbit</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#d9ded9;font-family:Inter,system-ui,sans-serif;color:#152018}canvas{display:block}.top{position:fixed;left:16px;right:16px;top:14px;display:flex;gap:8px;align-items:center;z-index:3}.brand{background:#152018;color:#fff;padding:10px 13px;border-radius:12px;font-size:11px;letter-spacing:.11em}.chip{background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.12);padding:8px 10px;border-radius:999px;font-size:10px}.legend{position:fixed;left:16px;bottom:16px;background:rgba(255,255,255,.92);padding:12px 14px;border-radius:14px;font-size:10px;line-height:1.7;z-index:3}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.panel{position:fixed;right:16px;top:66px;bottom:16px;width:340px;background:rgba(247,245,239,.97);border-radius:17px;padding:18px;box-sizing:border-box;transform:translateX(380px);transition:.22s;z-index:4;overflow:auto}.panel.open{transform:none}.panel h2{font:500 24px Georgia,serif;margin:6px 0 12px}.k{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#7d867f}.row{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:11px}.close{float:right;border:0;background:none;font-size:20px;cursor:pointer}.timeline{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(540px,50vw);background:rgba(20,30,24,.9);padding:10px 14px;border-radius:14px;color:#fff;font-size:10px;z-index:3}.timeline input{width:100%}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script></head><body>
<div class="top"><div class="brand">PRODUCT TWIN · DEVELOPER ORBIT</div><div class="chip">Stockholm Apartments · 5 floors</div><div class="chip" id="filter">Status view · All packages</div></div>
<div class="legend"><b>Delivery status</b><br><span class="dot" style="background:#3d7558"></span>Installed / accepted<br><span class="dot" style="background:#4c77a0"></span>On site<br><span class="dot" style="background:#d1a64f"></span>Ordered / in transit<br><span class="dot" style="background:#b95048"></span>Late / blocked<br><span class="dot" style="background:#9aa09a"></span>Not required yet<br><span class="dot" style="background:#795e9b"></span>Inspection / approval</div>
<div class="timeline"><div id="dateLabel">Project status · Week 32</div><input id="time" type="range" min="0" max="4" value="3" step="1"></div>
<aside class="panel" id="panel"><button class="close">×</button><div class="k" id="kind"></div><h2 id="title"></h2><div id="rows"></div></aside>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd9ded9);scene.fog=new THREE.Fog(0xd9ded9,30,85);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,140);camera.position.set(22,17,25);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,7,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x707b73,2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(12,22,14);sun.castShadow=true;scene.add(sun);
const colors={installed:0x3d7558,on_site:0x4c77a0,ordered:0xd1a64f,blocked:0xb95048,not_required:0x9aa09a,inspection:0x795e9b};const labels={installed:'Installed / accepted',on_site:'On site',ordered:'Ordered / in transit',blocked:'Late / blocked',not_required:'Not required yet',inspection:'Inspection / approval'};const objects=[];
function box(size,pos,status,meta){const m=new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshStandardMaterial({color:colors[status],roughness:.78}));m.position.set(...pos);m.castShadow=m.receiveShadow=true;m.userData={status,meta};scene.add(m);objects.push(m);return m}
// site + neighboring context
const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0xc5ccc5,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);for(let i=0;i<8;i++){const x=-28+(i%4)*18,z=-23+Math.floor(i/4)*46;const h=5+(i%3)*2;const n=new THREE.Mesh(new THREE.BoxGeometry(9,h,8),new THREE.MeshStandardMaterial({color:0xcfd4cf,roughness:1}));n.position.set(x,h/2,z);scene.add(n)}
const floors=5,unitW=3.0,unitD=7.5,fh=2.8;const statusByFloor=[['installed','installed','installed','inspection'],['installed','on_site','on_site','inspection'],['ordered','ordered','blocked','ordered'],['not_required','ordered','blocked','not_required'],['not_required','not_required','not_required','not_required']];
for(let f=0;f<floors;f++){for(let u=0;u<4;u++){const status=statusByFloor[f][u];const x=(u-1.5)*unitW;const y=.25+f*fh+fh/2;const z=0;box([unitW-.12,fh-.18,unitD-.12],[x,y,z],status,{id:`B01_F${f+1}_U${u+1}`,floor:f+1,unit:u+1,package:'Apartment fit-out',status,blocker:status==='blocked'?(u===2?'Bathroom pod supplier confirmation':'Façade package delay'):null,required_on_site:status==='blocked'?'2026-08-10':null,next:status==='ordered'?'Track supplier / freight':status==='on_site'?'Release installation crew':status==='inspection'?'QA / regulatory acceptance':status==='blocked'?'Resolve blocker':'—'});}}
// central core
box([3.2,floors*fh+.3,3.3],[0,(floors*fh)/2,-5.3],'installed',{id:'CORE_01',floor:'all',unit:'core',package:'Structure / circulation core',status:'installed',blocker:null,next:'—'});
// roof plant / PV
box([5,.5,3],[-3.2,floors*fh+.5,-.6],'ordered',{id:'ROOF_PV_01',floor:'roof',unit:'—',package:'PV package',status:'ordered',blocker:null,next:'Delivery ETA 9 days'});box([2,.8,2],[3.5,floors*fh+.65,-1.3],'blocked',{id:'ROOF_HVAC_01',floor:'roof',unit:'—',package:'Heat-pump plant',status:'blocked',blocker:'Technical submittal awaiting approval',next:'Engineer review'});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(objects)[0];if(h)open(h.object.userData.meta)});function open(m){document.getElementById('panel').classList.add('open');document.getElementById('kind').textContent=m.id;document.getElementById('title').textContent=m.package;document.getElementById('rows').innerHTML=`<div class="row"><b>Floor / unit</b><span>${m.floor} / ${m.unit}</span></div><div class="row"><b>Status</b><span>${labels[m.status]}</span></div><div class="row"><b>Blocker</b><span>${m.blocker||'None'}</span></div><div class="row"><b>Required on site</b><span>${m.required_on_site||'—'}</span></div><div class="row"><b>Next action</b><span>${m.next}</span></div><div class="row"><b>Graph trail</b><span>Element → package → Product Twins → PO/RFQ → logistics → install → QA</span></div>`}document.querySelector('.close').onclick=()=>document.getElementById('panel').classList.remove('open');
const time=document.getElementById('time'),weeks=['Week 16 · structure','Week 22 · envelope','Week 28 · first fix','Week 32 · current','Week 40 · target handover'];time.oninput=()=>document.getElementById('dateLabel').textContent='Project status · '+weeks[+time.value];
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
