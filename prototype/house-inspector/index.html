<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Twin · House Inspector</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#dde1dc;font-family:Inter,system-ui,sans-serif;color:#17211b}canvas{display:block}
#top{position:fixed;left:18px;right:18px;top:16px;display:flex;gap:8px;align-items:center;z-index:3}.brand{margin-right:10px;background:#17211b;color:#fff;padding:10px 13px;border-radius:12px;font-size:11px;letter-spacing:.11em}.lens{border:1px solid rgba(20,30,23,.15);background:rgba(255,255,255,.84);backdrop-filter:blur(12px);padding:9px 12px;border-radius:999px;font-size:11px;cursor:pointer}.lens.active{background:#17211b;color:#fff}
#legend{position:fixed;left:18px;bottom:18px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid rgba(20,30,23,.12);padding:11px 13px;border-radius:13px;font-size:10px;line-height:1.55;max-width:360px;z-index:3}.hint{opacity:.62}
#panel{position:fixed;right:16px;top:70px;bottom:16px;width:340px;box-sizing:border-box;background:rgba(247,244,237,.96);backdrop-filter:blur(20px);border:1px solid rgba(20,30,23,.12);border-radius:18px;padding:20px;overflow:auto;z-index:4;transform:translateX(380px);transition:.22s}#panel.open{transform:none}#panel h2{font:500 25px/1.05 Georgia,serif;margin:7px 0 12px}.k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#7b847e}.row{display:grid;grid-template-columns:100px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:11px}.row b{font-weight:600}.pill{display:inline-block;font-size:9px;background:#e4e7e1;border-radius:999px;padding:5px 7px;margin:3px 3px 0 0}.layer{font-size:10px;padding:7px 9px;margin-top:5px;border-radius:9px;background:#ece9e1}.close{float:right;border:0;background:none;font-size:20px;cursor:pointer}.status{margin-top:12px;padding:10px;border-radius:10px;background:#ebe8de;font-size:10px;line-height:1.45}
#explode{position:fixed;left:18px;top:70px;border:0;background:#fff;padding:9px 12px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.08);cursor:pointer;font-size:10px;z-index:3;display:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head><body>
<div id="top"><div class="brand">PRODUCT TWIN · PROJECT LENS</div>
<button class="lens active" data-mode="experience">Experience</button><button class="lens" data-mode="architecture">Architecture</button><button class="lens" data-mode="assembly">Build</button><button class="lens" data-mode="products">Products</button><button class="lens" data-mode="procurement">Procurement</button><button class="lens" data-mode="systems">Systems</button><button class="lens" data-mode="compliance">Regulation</button></div>
<button id="explode">Explode house</button>
<div id="legend"><b id="modeTitle">Experience</b><br><span id="modeCopy">Finished-building view. Click anything to inspect the same canonical project object underneath.</span><br><span class="hint">Drag to orbit · scroll to zoom · click element to dissect it</span></div>
<aside id="panel"><button class="close">×</button><div class="k" id="kind"></div><h2 id="title"></h2><div id="pills"></div><div id="rows"></div><div class="k" style="margin-top:16px">Assembly</div><div id="layers"></div><div class="status" id="status"></div></aside>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdde1dc);const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,100);camera.position.set(13,10,15);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.5,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x758179,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(8,12,7);sun.castShadow=true;scene.add(sun);
const C={stone:0xc8bda8,plaster:0xe8e3d9,glass:0x89a9b7,timber:0x8a7054,dark:0x37413b,solar:0x26343b,metal:0x777d79,soft:0xd8d2c5};
const objects=[],systems=[];function mat(color,opacity=1){return new THREE.MeshStandardMaterial({color,roughness:.78,transparent:opacity<1,opacity})}function box(size,pos,color,meta){const m=new THREE.Mesh(new THREE.BoxGeometry(...size),mat(color));m.position.set(...pos);m.castShadow=m.receiveShadow=true;m.userData.meta=meta;m.userData.base=m.position.clone();m.userData.baseMaterial=m.material;m.userData.explode=meta.explode||[0,0,0];scene.add(m);objects.push(m);return m}function line(points,color,meta){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,linewidth:2}));l.userData.meta=meta;l.visible=false;scene.add(l);systems.push(l);return l}
const wallLayers=['Interior finish','Board / plaster','Service zone','Insulation','Structure','Weather barrier','External finish'];
const meta=(id,label,type,category,product,state,reg,layers=[],explode=[0,0,0])=>({id,label,type,category,product,procurement:state,regulation:reg,layers,explode});
box([9,.25,7],[0,.125,0],C.stone,meta('SLAB_001','Ground floor slab','Slab','STRUCTURE.CONCRETE','Configured concrete package','ordered','review',['Floor finish','Screed','Insulation','Reinforced slab'],[0,-1.2,0]));
box([9,.22,7],[0,3.25,0],C.plaster,meta('ROOF_001','Flat roof assembly','Roof','ENVELOPE.ROOFING','Roof system unresolved','not_sourced','hold',['Interior ceiling','Service void','Structure','Insulation','Waterproofing','Roof finish'],[0,3.1,0]));
box([9,.25,3],[-0,1.6,-3.5],C.plaster,meta('WALL_N_001','North external wall','Wall','ENVELOPE.WALLS','Assembly not fully sourced','quoted','review',wallLayers,[0,0,-2.2]));
box([9,.25,3],[0,1.6,3.5],C.plaster,meta('WALL_S_001','Garden façade wall','Wall','ENVELOPE.WALLS','Assembly partly selected','selected','pass',wallLayers,[0,0,2.2]));
box([.25,7,3],[-4.5,0,1.6],C.plaster,meta('WALL_W_001','West external wall','Wall','ENVELOPE.WALLS','Assembly unresolved','not_sourced','hold',wallLayers,[-2.2,0,0]));
box([.25,7,3],[4.5,0,1.6],C.plaster,meta('WALL_E_001','East external wall','Wall','ENVELOPE.WALLS','Assembly selected','quoted','review',wallLayers,[2.2,0,0]));
box([.18,5,2.8],[-1.2,.7,1.55],C.plaster,meta('WALL_INT_001','Interior partition','Partition','INTERIORS.PARTITIONS','Partition system selected','ordered','pass',['Paint','Board','Stud/service zone','Board','Paint'],[-.8,0,0]));
box([3.4,.10,2.35],[1.5,3.37,1.45],C.glass,meta('WIN_001','Large sliding glazing','Window','OPENINGS.WINDOWS','Manufacturer system unresolved','not_sourced','review',['Frame','Glass','Hardware','Seals'],[0,0,2.7]));
box([2.9,1.05,.78],[1.0,-.65,.54],C.soft,meta('FFE_SOFA_001','Living room sofa','Furniture','FFE.SEATING.SOFA','Shopify reference selected','selected','pass',[],[0,0,1.4]));
box([1.4,.85,.18],[.6,.55,.28],C.timber,meta('FFE_TABLE_001','Coffee table','Furniture','FFE.TABLE.COFFEE','Product Twin unresolved','discovered','pass',[],[0,0,1.0]));
box([2.8,.08,1.1],[-2.8,-3.36,2.3],C.dark,meta('PV_001','PV array','Solar system','ENERGY.SOLAR.PANEL','System sizing incomplete','not_sourced','review',['Modules','Mounting','DC cabling','Inverter'],[0,2.8,0]));
box([.53,.16,.47],[-3.4,-2.9,.8],C.metal,meta('INV_001','Huawei inverter proxy','Equipment','ENERGY.SOLAR.INVERTER','Huawei SUN2000-10KTL-M1','discovered','review',[],[-1.2,0,0]));
line([[-4,1.1,0],[3.7,1.1,0],[3.7,1.1,-2.4]],0x3b6d9e,meta('PLUMB_001','Cold-water route','MEP network','PLUMBING.PIPE','Pipe system unresolved','not_sourced','review'));
line([[-3.5,2.2,-2.8],[-1,2.2,-2.8],[-1,2.2,2.5]],0xb68a3f,meta('ELEC_001','Electrical distribution','MEP network','ELECTRICAL.CABLE','Cable package unresolved','not_sourced','review'));
const ground=new THREE.GridHelper(28,28,0xa7afa8,0xc7ccc7);ground.position.y=-.01;scene.add(ground);
const modeInfo={experience:['Experience','Finished-building view. Click anything to inspect the same canonical project object underneath.'],architecture:['Architecture','Monochrome working model: geometry, linework and spatial hierarchy without product noise.'],assembly:['Build / Assembly','Explode the house into construction packages and inspect wall, roof and floor layer stacks.'],products:['Product Twins','The house becomes a map of real products, unresolved placeholders and configurable systems.'],procurement:['Procurement','Every component is colored by procurement state: unsourced → quoted → ordered → shipped → installed.'],systems:['Systems / MEP','Architectural shell becomes transparent while connected electrical, plumbing, solar and equipment networks are isolated.'],compliance:['Regulation','Spatial compliance lens: pass, review, hold and block states live directly on the building.']};
const catColors={'FFE':0xa77c52,'ENERGY':0x56786d,'OPENINGS':0x688aa0,'STRUCTURE':0x7d7d75,'ENVELOPE':0xa3947c,'INTERIORS':0x9a8573};const procurement={not_sourced:0xb95c54,discovered:0xc99054,quoted:0xd3ad5c,selected:0x78967b,ordered:0x527d65,in_production:0x5c778c,shipped:0x657baa,on_site:0x497e70,installed:0x356b51};const compliance={pass:0x47775c,review:0xc3994d,hold:0xb96c4e,block:0x9f4742,not_screened:0x888888};let mode='experience',exploded=false;
function setMode(next){mode=next;exploded=false;document.querySelectorAll('.lens').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.getElementById('modeTitle').textContent=modeInfo[mode][0];document.getElementById('modeCopy').textContent=modeInfo[mode][1];document.getElementById('explode').style.display=(mode==='assembly'||mode==='products')?'block':'none';objects.forEach(o=>{o.position.copy(o.userData.base);const m=o.userData.meta;o.material.wireframe=false;o.material.transparent=false;o.material.opacity=1;o.visible=true;if(mode==='architecture'){o.material=new THREE.MeshBasicMaterial({color:0xf4f2ec,wireframe:true});}else if(mode==='products'){const root=(m.category||'').split('.')[0];o.material=mat(catColors[root]||0x9b9f9a,m.type==='Wall'||m.type==='Roof'||m.type==='Slab'?0.18:1);}else if(mode==='procurement'){o.material=mat(procurement[m.procurement]||0x8b8b8b);}else if(mode==='systems'){o.material=mat(C.plaster,(m.type==='Wall'||m.type==='Roof'||m.type==='Slab'||m.type==='Partition')?.12:.28);}else if(mode==='compliance'){o.material=mat(compliance[m.regulation]||0x888888);}else{o.material=o.userData.baseMaterial;}});systems.forEach(s=>s.visible=mode==='systems');}
function toggleExplode(){exploded=!exploded;objects.forEach(o=>{const e=o.userData.explode;o.position.copy(o.userData.base).add(new THREE.Vector3(...e).multiplyScalar(exploded?1:0));});document.getElementById('explode').textContent=exploded?'Reassemble house':'Explode house';}
document.querySelectorAll('.lens').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.getElementById('explode').onclick=toggleExplode;
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObjects([...objects,...systems]).find(x=>x.object.userData.meta);if(h)open(h.object.userData.meta)});
function open(m){document.getElementById('panel').classList.add('open');document.getElementById('kind').textContent=m.type+' · '+m.id;document.getElementById('title').textContent=m.label;document.getElementById('pills').innerHTML=[m.category,m.procurement,m.regulation].filter(Boolean).map(x=>'<span class="pill">'+x+'</span>').join('');document.getElementById('rows').innerHTML='<div class="row"><b>Product</b><span>'+m.product+'</span></div><div class="row"><b>Procurement</b><span>'+m.procurement+'</span></div><div class="row"><b>Regulation</b><span>'+m.regulation+'</span></div>';document.getElementById('layers').innerHTML=(m.layers||[]).length?(m.layers.map((x,i)=>'<div class="layer">'+(i+1)+'. '+x+'</div>').join('')):'<div class="layer">Single object/system node</div>';document.getElementById('status').innerHTML='<b>Same object, different lens.</b><br>In production this node links to Product Twin identity, technical evidence, supplier/offer, order, ETA, installation record and as-built maintenance history.'}
document.querySelector('.close').onclick=()=>document.getElementById('panel').classList.remove('open');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});setMode('experience');
</script></body></html>
