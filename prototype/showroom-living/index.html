<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Real products in a real villa · Product Twin client preview</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e0d0a;color:#f4efe4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  .topline{position:absolute;left:22px;top:20px;display:flex;gap:14px;align-items:flex-start;background:rgba(18,15,10,.42);backdrop-filter:blur(10px);padding:12px 16px 12px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.1);max-width:430px}
  .topline .hero{width:104px;height:78px;border-radius:9px;object-fit:cover;flex:none;box-shadow:0 3px 12px rgba(0,0,0,.4)}
  .topline .k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#e6c79a}
  .topline h1{margin:3px 0 0;font:500 22px/1.05 Georgia,serif;color:#fbf7ee}
  .topline .loc{font-size:11px;color:#e9e2d2;margin-top:3px}
  .topline .specs{font-size:10px;color:#cfc7b6;margin-top:5px;line-height:1.4}
  .topline .lst{font-size:9px;color:#d8b98a;margin-top:5px;letter-spacing:.06em}
  .price{position:absolute;right:24px;top:22px;text-align:right}
  .price .k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#e7dcc4;opacity:.85}
  .price .v{font:500 22px/1 Georgia,serif;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
  .price .note{font-size:9px;color:#e7dcc4;opacity:.8;max-width:210px;margin-top:4px}
  .help{position:absolute;left:26px;bottom:20px;font-size:11px;color:#efe8d7;background:rgba(20,17,12,.5);backdrop-filter:blur(8px);padding:8px 12px;border-radius:999px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .roomtotal{position:absolute;right:24px;bottom:20px;background:rgba(20,17,12,.6);backdrop-filter:blur(10px);padding:9px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.1);text-align:right}
  .roomtotal .k{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#e6c79a}
  .roomtotal b{font:500 20px/1.1 Georgia,serif;color:#fff}
  .roomtotal .rt-note{display:block;font-size:9px;color:#cfc7b6;margin-top:2px}
  .swapbtn{margin-top:10px;width:100%;border:0;border-radius:10px;padding:10px;background:#1c2016;color:#f4efe4;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.02em}
  .swapbtn:hover{background:#2c3324}
  .tag{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);cursor:pointer}
  .tag .dot{width:26px;height:26px;border-radius:50%;background:rgba(250,246,238,.92);border:2px solid rgba(0,0,0,.15);box-shadow:0 3px 12px rgba(0,0,0,.35);display:grid;place-items:center;font-size:13px;color:#1c2016;transition:.15s}
  .tag:hover .dot{transform:scale(1.12);background:#fff}
  #panel{pointer-events:auto;position:absolute;right:18px;bottom:18px;width:326px;background:rgba(247,243,233,.98);color:#1c2016;border-radius:16px;padding:18px;box-sizing:border-box;transform:translateY(160%);transition:.24s cubic-bezier(.2,.7,.2,1);box-shadow:0 18px 50px rgba(0,0,0,.35)}
  #panel.open{transform:none}
  #panel .small{font-size:10px;color:#7a7358;text-transform:uppercase;letter-spacing:.12em}
  #panel h2{font:500 22px/1.05 Georgia,serif;margin:6px 0 3px}#panel .mk{font-size:11px;color:#6a6450;margin-bottom:8px}
  .offer{margin-top:10px;padding:11px 12px;border:1px solid #e0dccb;border-radius:11px;background:#fff}
  .offer strong{display:block;font:500 21px/1 Georgia,serif;margin:2px 0}.offer span{font-size:10px;color:#6a7360}
  .pill{display:inline-block;background:#eae7d8;padding:4px 8px;border-radius:999px;font-size:9px;margin:2px 2px 0 0}
  .warn{margin-top:9px;padding:9px;background:#f1e7d2;border-radius:9px;font-size:10px;color:#6f5a34;line-height:1.45}
  .close{float:right;border:0;background:none;color:#4a4636;font-size:18px;cursor:pointer;line-height:1}
  #loading{position:absolute;inset:0;display:grid;place-items:center;background:#0e0d0a;color:#e8e1cd;font-size:13px;letter-spacing:.03em;z-index:5}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head>
<body>
<div id="loading">Furnishing the villa with real product twins…</div>
<div id="hud">
  <div class="topline"><img class="hero" id="villa-hero" alt="" hidden /><div><div class="k">Product Twin · client preview</div><h1 id="villa-name">Villa</h1><div class="loc" id="villa-loc"></div><div class="specs" id="villa-specs"></div><div class="lst" id="villa-lst"></div></div></div>
  <div class="price"><div class="k">Asking price</div><div class="v" id="villa-price">—</div><div class="note" id="villa-note"></div></div>
  <div class="help">Drag to look around · scroll to zoom · tap a product</div>
  <div class="roomtotal" id="roomtotal"><span class="k">Room · furnished total</span><b id="roomtotal-v">—</b><span class="rt-note" id="roomtotal-n"></span></div>
  <aside id="panel"><button class="close" id="close">×</button>
    <div class="small">Product Twin · native manufacturer 3D</div><h2 id="p-title">—</h2><div class="mk" id="p-mk"></div>
    <div id="p-pills"></div>
    <div class="offer"><div class="small">Live trade offer</div><strong id="p-price">—</strong><span id="p-offerstate"></span></div>
    <button id="p-swap" class="swapbtn" hidden>⇄ Swap this piece</button>
    <div class="warn" id="p-warn"></div>
  </aside>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene_data = await fetch('../../data/showrooms/norr11-marbella-living-room-v0.1.json', { cache: 'no-store' }).then(r => r.json());
const property = scene_data.property || { name: 'Villa (placeholder)', location: 'Spain', price_display: '—', note: '' };
document.getElementById('villa-name').textContent = property.name;
document.getElementById('villa-loc').textContent = property.location + ' · furnished with real, purchasable pieces';
document.getElementById('villa-price').textContent = property.price_display;
document.getElementById('villa-specs').textContent = property.specs || '';
document.getElementById('villa-lst').textContent = property.reference ? `H&H · ${property.reference} · live listing` : '';
document.getElementById('villa-note').textContent = property.reference ? 'real for-sale listing · refresh before use' : (property.note || '');
if (property.hero_image) { const h = document.getElementById('villa-hero'); h.src = '../../' + property.hero_image; h.hidden = false; }

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// warm daylight sky seen through the window
scene.background = new THREE.Color(0xbfd4dd);

const [RW, RH, RD] = scene_data.room.size_m;

// Room spans z = +1 (open front) to z = -(RD-1) (back wall); x = -RW/2 .. RW/2.
const BACK_Z = -(RD - 1);
const CENTER_Z = (1 + BACK_Z) / 2;
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 200);
camera.position.set(3.15, 1.42, 3.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.2, 0.5, -3.0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.03; controls.minDistance = 2.4; controls.maxDistance = 12;

// ---- procedural textures (no external assets) ----
function makeCanvas(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const oakTex = makeCanvas(1024, 1024, (x, w, h) => {
  x.fillStyle = '#b48a5b'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 8; i++) { // planks
    const y = i * h / 8; x.fillStyle = `rgba(${120 + Math.round(Math.sin(i) * 18)},${90},${55},1)`; x.fillRect(0, y, w, h / 8 - 2);
    for (let g = 0; g < 40; g++) { x.strokeStyle = `rgba(90,62,35,${0.05 + Math.random() * 0.08})`; x.beginPath(); const gy = y + Math.random() * h / 8; x.moveTo(0, gy); x.bezierCurveTo(w / 3, gy + (Math.random() - .5) * 10, 2 * w / 3, gy + (Math.random() - .5) * 10, w, gy); x.stroke(); }
  }
});
oakTex.wrapS = oakTex.wrapT = THREE.RepeatWrapping; oakTex.repeat.set(4, 4);
const plasterTex = makeCanvas(512, 512, (x, w, h) => { x.fillStyle = '#efe7d8'; x.fillRect(0, 0, w, h); for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${200 + Math.random() * 40},${190 + Math.random() * 30},${170},${Math.random() * 0.05})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); } });
plasterTex.wrapS = plasterTex.wrapT = THREE.RepeatWrapping; plasterTex.repeat.set(3, 2);

const floorMat = new THREE.MeshStandardMaterial({ map: oakTex, roughness: 0.62, metalness: 0 });
const wallMat = new THREE.MeshStandardMaterial({ map: plasterTex, roughness: 0.95 });
const ceilMat = new THREE.MeshStandardMaterial({ color: 0xf3ede1, roughness: 1 });

const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), floorMat);
floor.rotation.x = -Math.PI / 2; floor.position.z = CENTER_Z; floor.receiveShadow = true; scene.add(floor);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), ceilMat);
ceil.rotation.x = Math.PI / 2; ceil.position.set(0, RH, CENTER_Z); scene.add(ceil);
function wall(w, h, x, y, z, ry = 0) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.14), wallMat); m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m; }
wall(RW, RH, 0, RH / 2, BACK_Z);                       // back wall (far)
wall(RD, RH, -RW / 2, RH / 2, CENTER_Z, Math.PI / 2);  // left wall
wall(RD, RH, RW / 2, RH / 2, CENTER_Z, Math.PI / 2);   // right wall

// large window opening on the back wall -> Mediterranean view + light
// golden-hour Mediterranean bay, matching the villa's real terrace hero (P1)
const view = makeCanvas(1024, 512, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#cfe0e6'); g.addColorStop(0.32, '#f0e2cf'); g.addColorStop(0.5, '#f6ddbf'); g.addColorStop(0.52, '#7ba7c0'); g.addColorStop(1, '#3d7ea0');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  // distant headland silhouette across the bay
  x.fillStyle = 'rgba(96,110,120,.55)'; x.beginPath(); x.moveTo(0, h * 0.52);
  x.bezierCurveTo(w * 0.18, h * 0.36, w * 0.32, h * 0.34, w * 0.46, h * 0.5); x.lineTo(w * 0.46, h * 0.53); x.lineTo(0, h * 0.53); x.closePath(); x.fill();
  // town glow on the far shore + sun glints on the water
  x.fillStyle = 'rgba(255,238,205,.6)'; for (let i = 0; i < 60; i++) x.fillRect(w * 0.5 + Math.random() * w * 0.45, h * 0.5 + Math.random() * 3, 2, 2);
  x.fillStyle = 'rgba(255,255,255,.45)'; for (let i = 0; i < 26; i++) x.fillRect(Math.random() * w, h * 0.6 + Math.random() * h * 0.35, 40 + Math.random() * 90, 1.4);
});
const windowPane = new THREE.Mesh(new THREE.PlaneGeometry(RW * 0.64, RH * 0.66), new THREE.MeshBasicMaterial({ map: view }));
windowPane.position.set(0.2, RH * 0.52, BACK_Z + 0.08); scene.add(windowPane);
const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2723, roughness: 0.5, metalness: 0.3 });
function bar(w, h, x, y) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.06), frameMat); m.position.set(x, y, BACK_Z + 0.12); scene.add(m); }
bar(RW * 0.66, 0.06, 0.2, RH * 0.52 + RH * 0.33); bar(RW * 0.66, 0.06, 0.2, RH * 0.52 - RH * 0.33); bar(0.06, RH * 0.66, 0.2 - RW * 0.32, RH * 0.52); bar(0.06, RH * 0.66, 0.2 + RW * 0.32, RH * 0.52); bar(0.05, RH * 0.66, 0.2, RH * 0.52);

// warm golden-hour sun coming in from the front-side, so product fronts face the light
const sun = new THREE.DirectionalLight(0xffdca6, 3.2);
sun.position.set(3.5, 6.0, 3.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); const s = sun.shadow.camera; s.near = 0.5; s.far = 30; s.left = -8; s.right = 8; s.top = 8; s.bottom = -8; sun.shadow.bias = -0.0004;
scene.add(sun);
// soft warm bounce from the window side + cool sky fill
scene.add(new THREE.HemisphereLight(0xf3e6cf, 0x6b5a44, 0.4));
const bounce = new THREE.PointLight(0xffe4b8, 0.5, 18); bounce.position.set(0.2, 1.6, BACK_Z + 1.5); scene.add(bounce);

// rug + a simple bronze coffee table for context (clearly scene props, not products)
const rug = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.6), new THREE.MeshStandardMaterial({ color: 0xc3ad88, roughness: 1 }));
rug.rotation.x = -Math.PI / 2; rug.position.set(0, 0.012, -2.4); rug.receiveShadow = true; scene.add(rug);
const table = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.32, 0.6), new THREE.MeshStandardMaterial({ color: 0x6f5a3c, roughness: 0.4, metalness: 0.35 }));
table.position.set(0, 0.16, -2.4); table.castShadow = table.receiveShadow = true; scene.add(table);

// warm scene props (clearly decor, not products): a potted plant + framed art
(function plant(px, pz) {
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.17, 0.4, 20), new THREE.MeshStandardMaterial({ color: 0xb9b0a0, roughness: 0.9 }));
  pot.position.set(px, 0.2, pz); pot.castShadow = pot.receiveShadow = true; scene.add(pot);
  const foliage = new THREE.MeshStandardMaterial({ color: 0x5f7d4f, roughness: 0.85, flatShading: true });
  for (let i = 0; i < 5; i++) { const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.9, 5), foliage); leaf.position.set(px + (Math.sin(i) * 0.12), 0.85 + i * 0.04, pz + Math.cos(i) * 0.12); leaf.rotation.z = (i - 2) * 0.28; leaf.castShadow = true; scene.add(leaf); }
})(RW / 2 - 0.7, BACK_Z + 0.9);
(function art(ax) {
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.95, 0.05), new THREE.MeshStandardMaterial({ color: 0x2a2723, roughness: 0.5, metalness: 0.3 }));
  frame.position.set(ax, 1.55, BACK_Z + 0.09); scene.add(frame);
  const artTex = makeCanvas(512, 340, (x, w, h) => { const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#c98f5a'); g.addColorStop(0.5, '#e7c79a'); g.addColorStop(1, '#8a5a3a'); x.fillStyle = g; x.fillRect(0, 0, w, h); x.strokeStyle = 'rgba(255,255,255,.25)'; for (let i = 0; i < 6; i++) { x.beginPath(); x.moveTo(0, h * (0.3 + i * 0.1)); x.bezierCurveTo(w / 3, h * (0.2 + i * 0.1), 2 * w / 3, h * (0.4 + i * 0.1), w, h * (0.3 + i * 0.1)); x.stroke(); } });
  const canvasArt = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.86), new THREE.MeshBasicMaterial({ map: artTex })); canvasArt.position.set(ax, 1.55, BACK_Z + 0.12); scene.add(canvasArt);
})(-RW / 2 + 1.4);

// soft contact-shadow blob under each product
const blobTex = makeCanvas(256, 256, (x, w, h) => { const g = x.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2); g.addColorStop(0, 'rgba(0,0,0,.42)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); });
function contactShadow(cx, cz, sx, sz) { const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(cx, 0.015, cz); scene.add(m); }

// manifest gives real title/offer/GLB for swap alternates by twin_id
const manifest = await fetch('../../data/geometry/native-3d-showcase-manifest.json', { cache: 'no-store' }).then(r => r.json()).catch(() => ({ entries: [] }));
const byTwin = new Map((manifest.entries || []).filter(e => e.resolved).map(e => [e.twin_id, e]));
const mfg = t => t.includes('WENDELBO') ? 'Wendelbo' : (t.includes('NORR11') ? 'NORR11' : '');
function altProduct(twin_id, placement, role, category_id) {
  const e = byTwin.get(twin_id) || {};
  const price = e.offer?.price?.amount != null ? Number(e.offer.price.amount) : null;
  return {
    twin_id, role, category_id: category_id || e.category_id,
    identity: { manufacturer: mfg(twin_id), model: e.title || twin_id, merchant_sku: '' },
    avatar: { level: 'G2', source: 'native_manufacturer_model3d', runtime_glb: e.glb?.runtime_path, rights_state: 'review' },
    placement,
    offer_snapshot: { merchant: 'Design Public Group (trade)', currency: e.offer?.price?.currency || 'USD', unit_price: price, available: !!e.offer?.available, observed_at: '2026-08-18', es_checkout_state: 'exact ES postcode tax/freight/delivery refresh required' },
  };
}

const loader = new GLTFLoader();
const picks = [];
const tagEls = [];
let loaded = 0;

function placeProduct(root, p) {
  const box = new THREE.Box3().setFromObject(root); const size = new THREE.Vector3(); box.getSize(size);
  root.position.x += p.position_m[0] - (box.min.x + size.x / 2);
  root.position.z += p.position_m[2] - (box.min.z + size.z / 2);
  root.position.y += -box.min.y + (p.position_m[1] || 0);
  root.rotation.y = (p.rotation_deg_y || 0) * Math.PI / 180;
  return size;
}

// build one swap cycle per placed role: [placed product, ...alternates]
const cyclesByRole = new Map();
for (const p of scene_data.products) {
  const alt = (scene_data.swap_alternates || []).find(a => a.role === p.role);
  const cycle = [p, ...((alt?.twin_ids) || []).map(t => altProduct(t, p.placement, p.role, p.category_id))].filter(x => x.avatar?.runtime_glb);
  cyclesByRole.set(p.role, { cycle, index: 0, roots: new Map() });
}

for (const [role, g] of cyclesByRole) {
  for (let i = 0; i < g.cycle.length; i++) {
    const product = g.cycle[i];
    try {
      const gltf = await loader.loadAsync('../../' + product.avatar.runtime_glb);
      const root = gltf.scene;
      root.userData.role = role;
      root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.userData.role = role; } });
      scene.add(root);
      const size = placeProduct(root, product.placement);
      root.visible = i === 0;
      g.roots.set(i, { root, size });
      picks.push(root);
      if (i === 0) {
        contactShadow(product.placement.position_m[0], product.placement.position_m[2], Math.max(size.x, size.z) * 1.25, Math.max(size.x, size.z) * 1.25);
        const anchor = new THREE.Vector3(product.placement.position_m[0], size.y * 0.9, product.placement.position_m[2]);
        const el = document.createElement('div'); el.className = 'tag'; el.innerHTML = '<div class="dot">+</div>';
        el.onclick = () => showPanel(role);
        document.getElementById('hud').appendChild(el);
        tagEls.push({ el, anchor });
        loaded++;
      }
    } catch (e) { console.error('load failed', product.twin_id, e); }
  }
}

document.getElementById('loading').style.display = 'none';

const fmt = (v, cur) => v == null ? '—' : `$${Math.round(v).toLocaleString()} ${cur}`;
function updateTotal() {
  let sum = 0, cur = 'USD', pending = false;
  for (const [, g] of cyclesByRole) { const o = g.cycle[g.index].offer_snapshot; if (typeof o.unit_price === 'number') { sum += o.unit_price; cur = o.currency; } else pending = true; }
  document.getElementById('roomtotal-v').textContent = fmt(sum, cur);
  document.getElementById('roomtotal-n').textContent = `${cyclesByRole.size} pieces · live trade list${pending ? ' · some pending' : ''}`;
}
updateTotal();

const panel = document.getElementById('panel');
function showPanel(role) {
  const g = cyclesByRole.get(role); const p = g.cycle[g.index]; const o = p.offer_snapshot;
  document.getElementById('p-title').textContent = `${p.identity.manufacturer} ${p.identity.model}`;
  document.getElementById('p-mk').textContent = `SKU ${p.identity.merchant_sku || '—'}${p.identity.configuration ? ' · ' + p.identity.configuration : ''}`;
  document.getElementById('p-pills').innerHTML = [p.category_id, p.avatar.level, 'native MODEL_3D', 'ES join ✓'].map(t => `<span class="pill">${t}</span>`).join('');
  document.getElementById('p-price').textContent = fmt(o.unit_price, o.currency);
  document.getElementById('p-offerstate').textContent = `${o.merchant} · ${o.available ? 'available' : 'unavailable'} · ${o.observed_at}`;
  document.getElementById('p-warn').textContent = `Exact finish not bound to variant. ${o.es_checkout_state}. Native GLB rights: review.`;
  const swap = document.getElementById('p-swap');
  if (g.cycle.length > 1) { swap.hidden = false; swap.textContent = `⇄ Swap this piece (${g.index + 1}/${g.cycle.length})`; swap.onclick = () => swapRole(role); }
  else swap.hidden = true;
  panel.classList.add('open');
}
function swapRole(role) {
  const g = cyclesByRole.get(role);
  const prev = g.roots.get(g.index); if (prev) prev.root.visible = false;
  g.index = (g.index + 1) % g.cycle.length;
  const cur = g.roots.get(g.index); if (cur) cur.root.visible = true;
  showPanel(role); updateTotal();
}
document.getElementById('close').onclick = () => panel.classList.remove('open');

// project tags to screen each frame
const v = new THREE.Vector3();
function updateTags() {
  for (const { el, anchor } of tagEls) {
    v.copy(anchor).project(camera);
    const behind = v.z > 1;
    el.style.display = behind ? 'none' : 'block';
    el.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px';
    el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px';
  }
}
// click products directly too
const ray = new THREE.Raycaster(); const m2 = new THREE.Vector2();
renderer.domElement.addEventListener('click', ev => {
  m2.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(m2, camera);
  let o = ray.intersectObjects(picks, true)[0]?.object; while (o && !o.userData.role) o = o.parent;
  if (o) showPanel(o.userData.role);
});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function animate() { requestAnimationFrame(animate); controls.update(); updateTags(); renderer.render(scene, camera); })();
</script>
</body>
</html>
