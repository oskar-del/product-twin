<!doctype html><meta charset=utf8><title>Villa 4 — two floors</title>
<style>html,body{margin:0;height:100%;background:#c7d0d2;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc7d0d2);
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,3000);cam.position.set(24,34,34);
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;document.body.append(R.domElement);
const ctr=new OrbitControls(cam,R.domElement);ctr.enableDamping=true;ctr.target.set(0,3,0);
scene.add(new THREE.HemisphereLight(0xeef4ff,0x8a9088,1.0));
const sun=new THREE.DirectionalLight(0xfff0d8,2.6);sun.position.set(28,54,26);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.bias=-0.0004;const s=sun.shadow.camera;s.left=-40;s.right=40;s.top=40;s.bottom=-40;s.far=200;scene.add(sun);
const V=new URLSearchParams(location.search).get('v')||'4';
const D=await (await fetch('v'+V+'floors.json')).json();
const TL=new THREE.TextureLoader();
const wallMat=new THREE.MeshStandardMaterial({color:0xeee9df,roughness:.8});
const slabMat=(t)=>new THREE.MeshStandardMaterial({map:t,roughness:.9});
function buildFloor(f,y0,wallH,tex){
 const cs=f.cellsize;
 // floor slab with plan texture
 const t=TL.load(tex);t.colorSpace=THREE.SRGBColorSpace;
 const slab=new THREE.Mesh(new THREE.BoxGeometry(f.texw,.25,f.texh),new THREE.MeshStandardMaterial({color:0xdfdacd,roughness:1}));
 slab.position.set(f.texoffx+f.texw/2,y0-.25,f.texoffy+f.texh/2);slab.receiveShadow=true;scene.add(slab);
 const plane=new THREE.Mesh(new THREE.PlaneGeometry(f.texw,f.texh),new THREE.MeshStandardMaterial({map:t,roughness:.95}));
 plane.rotation.x=-Math.PI/2;plane.position.set(f.texoffx+f.texw/2,y0+.06,f.texoffy+f.texh/2);scene.add(plane);
 // walls
 const geo=new THREE.BoxGeometry(cs*1.06,wallH,cs*1.06);
 const inst=new THREE.InstancedMesh(geo,wallMat,f.cells.length);inst.castShadow=true;inst.receiveShadow=true;
 const M=new THREE.Matrix4();
 f.cells.forEach((c,k)=>{M.makeTranslation(c[0],y0+wallH/2,c[1]);inst.setMatrixAt(k,M);});
 inst.instanceMatrix.needsUpdate=true;scene.add(inst);
}
buildFloor(D.baja,0,3.1,'v'+V+'baja.png');
buildFloor(D.alta,3.4,2.8,'v'+V+'alta.png');
// thin roof over upper (translucent so you can still see in from above)
const rf=new THREE.Mesh(new THREE.BoxGeometry(D.alta.texw+1,.3,D.alta.texh+1),new THREE.MeshStandardMaterial({color:0xe7ded0,roughness:.6,transparent:true,opacity:.25}));
rf.position.set(D.alta.texoffx+D.alta.texw/2,3.4+2.8+.15,D.alta.texoffy+D.alta.texh/2);scene.add(rf);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
window.__t={scene,camera:cam,renderer:R,controls:ctr};
window.snap=(px)=>{const w=px||1200,h=Math.round(w*innerHeight/innerWidth);const o=document.createElement('canvas');o.width=w;o.height=h;R.render(scene,cam);o.getContext('2d').drawImage(R.domElement,0,0,w,h);return o.toDataURL('image/jpeg',.82).split(',')[1];};
R.setAnimationLoop(()=>{ctr.update();R.render(scene,cam);});
</script>
