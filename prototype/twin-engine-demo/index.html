<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>twin-engine v0.1 · conformance scene</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d9e0db;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  .loading{position:fixed;inset:0;display:grid;place-items:center;background:#d9e0db;font-size:11px;letter-spacing:.14em;z-index:9;text-align:center;padding:24px}
  .loading code{display:block;margin-top:10px;font-size:11px;letter-spacing:0}
</style>
<script type="importmap">
{"imports":{
  "three":"/node_modules/three/build/three.module.js",
  "three/addons/":"/node_modules/three/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage">
</div>
<div class="loading" id="loading">LOADING TWIN-ENGINE…</div>
<script type="module">
import {createTwinViewer} from "/engine/twin-engine.mjs";

const loading = document.getElementById("loading");
try {
  const viewer = await createTwinViewer({
    mount: document.getElementById("stage"),
    sceneUrl: "/data/scenes/twin-engine-conformance/scene-v0.1.json",
    brand: "twin-engine v0.1 · conformance fixture"
  });
  loading.remove();
  // Exposed so the headless check can drive and interrogate the running engine.
  globalThis.twinViewer = viewer;
  console.log(`${viewer.version} ready · ${viewer.scene.elements.length} elements · ${viewer.stages.length} stages`);
} catch (error) {
  loading.classList.add("error");
  loading.innerHTML = `twin-engine could not start.<br><br>${error.message}<code>npm run engine:demo</code>`;
  console.error(error);
}
</script>
</body>
</html>
